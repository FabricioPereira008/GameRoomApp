# PRs semanais de atualização. As bibliotecas AndroidX/Compose/Kotlin vêm agrupadas para atualizar
# juntas (costumam depender umas das outras). Cada PR precisa regenerar
# gradle/verification-metadata.xml: ./scripts/update-verification.sh
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["com.android.*", "androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      testes:
        patterns: ["junit:*", "org.robolectric:*", "com.networknt:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
